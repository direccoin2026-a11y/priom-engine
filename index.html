<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <title>🌍 PRIOM V0.4 - Demo "Tierra Cuántica"</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
        canvas#gameCanvas { display: block; width: 100vw; height: 100vh; background: #0a0a0f; }
        
        /* ===== HUD ===== */
        #hud {
            position: fixed; top: 16px; left: 16px;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(24px);
            border: 1px solid rgba(124,58,237,0.2); border-radius: 16px;
            padding: 14px 22px; min-width: 200px; pointer-events: none; z-index: 100;
            box-shadow: 0 20px 80px rgba(0,0,0,0.9);
        }
        #hud .logo { font-size: 20px; font-weight: 900; background: linear-gradient(135deg, #7c3aed, #06b6d4, #10b981, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -0.5px; }
        #hud .subtitle { font-size: 9px; color: #6b7280; letter-spacing: 2px; text-transform: uppercase; font-weight: 300; }
        
        .badge-container { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .badge { display: inline-flex; align-items: center; padding: 2px 12px; border-radius: 9999px; font-size: 7px; font-weight: 700; text-transform: uppercase; color: #fff; letter-spacing: 0.5px; }
        .badge-trinity { background: linear-gradient(135deg, #7c3aed, #f59e0b); }
        .badge-meta { background: linear-gradient(135deg, #06b6d4, #0891b2); }
        .badge-ai { background: linear-gradient(135deg, #10b981, #059669); }
        .badge-quantum { background: linear-gradient(135deg, #7c3aed, #06b6d4, #10b981); }
        
        /* ===== STATS ===== */
        #stats-panel {
            position: fixed; top: 16px; right: 16px;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.04); border-radius: 16px;
            padding: 12px 16px; min-width: 170px; pointer-events: none; z-index: 100;
            box-shadow: 0 20px 80px rgba(0,0,0,0.9);
            max-height: calc(100vh - 140px); overflow-y: auto;
        }
        #stats-panel::-webkit-scrollbar { width: 2px; }
        #stats-panel::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 1px; }
        #stats-panel .stat { display: flex; justify-content: space-between; padding: 2px 0; font-size: 10px; color: #9ca3af; border-bottom: 1px solid rgba(255,255,255,0.02); }
        #stats-panel .stat:last-child { border-bottom: none; }
        #stats-panel .stat .value { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
        #stats-panel .stat .value.good { color: #10b981; }
        #stats-panel .stat .value.warn { color: #f59e0b; }
        #stats-panel .stat .value.bad { color: #ef4444; }
        #stats-panel .stat .value.ai { color: #8b5cf6; }
        #stats-panel .stat .value.ultra { color: #fbbf24; }
        #stats-panel .stat .value.meta { color: #06b6d4; }
        
        /* ===== TIME INDICATOR ===== */
        #time-indicator {
            position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 30px;
            padding: 6px 20px; z-index: 90;
            font-size: 11px; color: #9ca3af; letter-spacing: 1px;
            display: flex; align-items: center; gap: 16px;
            pointer-events: none;
            transition: all 0.5s ease;
        }
        #time-indicator .time-label { font-weight: 600; color: #fff; }
        
        /* ===== AI STATUS ===== */
        #ai-status-bar {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); backdrop-filter: blur(24px);
            border: 1px solid rgba(124,58,237,0.1); border-radius: 9999px;
            padding: 8px 28px; z-index: 100; display: flex; align-items: center; gap: 18px;
            min-width: 520px; justify-content: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        #ai-status-bar .ai-icon { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #f59e0b); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        #ai-status-bar .ai-text { font-size: 10px; color: #9ca3af; text-align: center; }
        #ai-status-bar .ai-text strong { color: #8b5cf6; font-weight: 700; }
        #ai-status-bar .ai-progress { width: 120px; height: 4px; background: rgba(255,255,255,0.04); border-radius: 2px; overflow: hidden; flex-shrink: 0; }
        #ai-status-bar .ai-progress .fill { height: 100%; background: linear-gradient(90deg, #7c3aed, #06b6d4, #10b981, #f59e0b); border-radius: 2px; transition: width 0.3s ease; }
        #ai-status-bar .ai-stats { font-size: 9px; color: #6b7280; display: flex; gap: 14px; flex-shrink: 0; }
        #ai-status-bar .ai-stats .highlight { color: #8b5cf6; font-weight: 600; }
        #ai-status-bar .ai-stats .meta { color: #06b6d4; font-weight: 600; }
        
        /* ===== CONTROLES ===== */
        #controls {
            position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; gap: 4px; flex-wrap: wrap; justify-content: center;
            max-width: 95vw; padding: 6px;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(12px);
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.02);
        }
        #controls button {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.03);
            color: #9ca3af; padding: 4px 14px; border-radius: 8px; font-size: 8px;
            font-weight: 500; cursor: pointer; transition: all 0.2s ease;
            font-family: 'Segoe UI', system-ui, sans-serif; touch-action: manipulation;
            white-space: nowrap;
        }
        #controls button:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.06); transform: translateY(-1px); color: #fff; }
        #controls button:active { transform: scale(0.95); }
        #controls button.active { background: rgba(124,58,237,0.1); border-color: #8b5cf6; color: #8b5cf6; }
        #controls button.dual-ai { background: linear-gradient(135deg, #7c3aed, #f59e0b); border-color: transparent; color: #fff; font-weight: 700; }
        
        .ctrl-group { display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 6px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.02); }
        .ctrl-group .group-label { font-size: 7px; color: #4b5563; text-transform: uppercase; letter-spacing: 0.5px; padding-right: 4px; }
        
        .time-slider-container {
            display: flex; align-items: center; gap: 6px; padding: 2px 8px;
            background: rgba(255,255,255,0.02); border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.02); flex: 1; min-width: 100px;
        }
        .time-slider-container input[type="range"] {
            flex: 1; height: 3px; -webkit-appearance: none; appearance: none;
            background: rgba(255,255,255,0.06); border-radius: 2px; outline: none;
            accent-color: #8b5cf6;
        }
        .time-slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 12px; height: 12px;
            border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #06b6d4);
            cursor: pointer;
        }
        
        /* ===== MINIMAP ===== */
        #minimap-canvas {
            position: fixed; bottom: 110px; left: 16px; z-index: 90;
            border-radius: 50%; box-shadow: 0 0 30px rgba(0,0,0,0.6);
            background: rgba(0,0,0,0.3); border: 2px solid rgba(124,58,237,0.1);
            width: 140px; height: 140px; pointer-events: none;
        }
        #minimap-canvas:hover { border-color: rgba(124,58,237,0.3); transform: scale(1.05); }
        
        /* ===== NOTIFICACIONES ===== */
        #notifications { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 200; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 90vw; }
        .notification { background: rgba(0,0,0,0.92); backdrop-filter: blur(20px); border: 1px solid rgba(124,58,237,0.12); border-radius: 10px; padding: 8px 20px; font-size: 11px; color: #fff; animation: notifIn 0.4s ease, notifOut 0.4s 3.5s ease forwards; box-shadow: 0 10px 40px rgba(0,0,0,0.6); pointer-events: none; font-weight: 500; }
        @keyframes notifIn { from { opacity: 0; transform: translateY(-20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes notifOut { to { opacity: 0; transform: translateY(-20px) scale(0.95); } }
        .notification.success { border-color: #10b981; color: #10b981; }
        .notification.warning { border-color: #f59e0b; color: #f59e0b; }
        .notification.error { border-color: #ef4444; color: #ef4444; }
        .notification.info { border-color: #06b6d4; color: #06b6d4; }
        
        @media (max-width: 768px) {
            #hud { top: 10px; left: 10px; padding: 10px 14px; min-width: 140px; border-radius: 12px; }
            #hud .logo { font-size: 16px; }
            #stats-panel { top: 10px; right: 10px; padding: 8px 12px; min-width: 120px; border-radius: 12px; max-height: calc(100vh - 120px); }
            #stats-panel .stat { font-size: 8px; padding: 1px 0; }
            #ai-status-bar { bottom: 70px; padding: 6px 16px; gap: 10px; min-width: auto; flex-wrap: wrap; border-radius: 12px; }
            #ai-status-bar .ai-progress { width: 60px; }
            #controls { bottom: 56px; gap: 3px; padding: 4px; border-radius: 8px; max-width: 98vw; }
            #controls button { padding: 3px 8px; font-size: 7px; border-radius: 4px; }
            .time-slider-container { min-width: 70px; padding: 2px 6px; }
            #minimap-canvas { bottom: 80px; left: 10px; width: 100px; height: 100px; }
            #time-indicator { bottom: 120px; font-size: 9px; padding: 4px 14px; gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- ===== HUD ===== -->
    <div id="hud">
        <div class="logo">🌍 PRIOM V0.4</div>
        <div class="subtitle">🌲 Tierra Cuántica · Ecosistema Vivo</div>
        <div class="badge-container">
            <span class="badge badge-trinity">🧬 TRINITY AI</span>
            <span class="badge badge-meta">⚡ META</span>
            <span class="badge badge-ai">🎯 OPTIMIZANDO</span>
            <span class="badge badge-quantum">🌍 MUNDO VIVO</span>
        </div>
    </div>

    <!-- ===== STATS ===== -->
    <div id="stats-panel">
        <div class="stat"><span>📊 FPS</span><span class="value good" id="fps">0</span></div>
        <div class="stat"><span>🌳 Árboles</span><span class="value" id="trees">0</span></div>
        <div class="stat"><span>🦌 Animales</span><span class="value" id="animals">0</span></div>
        <div class="stat"><span>💾 RAM</span><span class="value" id="ram">0 MB</span></div>
        <div class="stat"><span>⚡ Calidad</span><span class="value ultra" id="quality">ULTRA</span></div>
        <div class="stat"><span>🎯 IA Confianza</span><span class="value ai" id="confidence">100%</span></div>
        <div class="stat"><span>🕐 Hora</span><span class="value meta" id="time-display">12:00</span></div>
    </div>

    <!-- ===== TIME INDICATOR ===== -->
    <div id="time-indicator">
        <span class="time-icon" id="time-icon">🌅</span>
        <span class="time-label" id="time-label">Amanecer</span>
        <span style="color:#4b5563;">|</span>
        <span id="weather-label" style="color:#9ca3af;">☀️ Despejado</span>
    </div>

    <!-- ===== AI STATUS ===== -->
    <div id="ai-status-bar">
        <div class="ai-icon">🧠</div>
        <div class="ai-text">
            <strong id="ai-action">TRINITY AI ACTIVA</strong>
            <span class="ai-detail" id="ai-detail">· Explorando el mundo...</span>
        </div>
        <div class="ai-progress"><div class="fill" id="ai-progress-fill" style="width:100%"></div></div>
        <div class="ai-stats">
            <span>🎯 IA: <span class="highlight" id="ai-conf">100%</span></span>
            <span>🧬 Meta: <span class="meta" id="ai-meta">100%</span></span>
            <span>⚡ FPS: <span class="highlight" id="ai-fps">0</span></span>
        </div>
    </div>

    <!-- ===== CONTROLES ===== -->
    <div id="controls">
        <button class="active dual-ai" id="btn-dual">🧠 TRINITY AI</button>
        
        <div class="ctrl-group">
            <span class="group-label">Calidad</span>
            <button id="btn-low">🔽 Low</button>
            <button id="btn-medium">🔄 Med</button>
            <button id="btn-high">🔼 High</button>
            <button id="btn-ultra">⚡ Ultra</button>
            <button id="btn-quantum" style="background:linear-gradient(135deg,#7c3aed,#06b6d4);border-color:transparent;color:#fff;font-weight:700;">🌀 Quantum</button>
        </div>
        
        <button id="btn-weather">☀️ Clima</button>
        <button id="btn-reset">🔄 Reset</button>
        
        <div class="time-slider-container">
            <span class="time-icon">🕐</span>
            <input type="range" id="time-slider" min="0" max="0.999" step="0.001" value="0.5">
        </div>
    </div>

    <!-- ===== NOTIFICACIONES ===== -->
    <div id="notifications"></div>

    <!-- ===== MINIMAP ===== -->
    <canvas id="minimap-canvas" width="140" height="140"></canvas>

    <!-- ===== CANVAS ===== -->
    <canvas id="gameCanvas"></canvas>

    <!-- ============================================================
         CARGA DE SCRIPTS
         ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/MaskPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/math/SimplexNoise.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/SSAOShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/SSAOPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/FXAAShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/BokehShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/BokehPass.js"></script>

    <script>
    // ============================================================
    //  🚀 INICIAR MOTOR
    //  ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🌍 Iniciando Priom Engine...');
        
        // Configurar CONFIG global
        window.CONFIG = {
            version: '0.4.3',
            build: '2026.08.25',
            maxEntities: 100000,
            targetFPS: 60,
            quality: 'ultra',
            lodDistance: 300,
            waterEnabled: true,
            particlesEnabled: true,
            shadowsEnabled: true,
            bloomEnabled: true,
            ssaoEnabled: true,
            debug: false,
            worldSize: 500,
            terrainHeight: 40,
            treeDensity: 0.35,
            animalCount: 50
        };
        
        // Crear motor
        const engine = new PriomEngine({
            qualityLevel: 'ultra',
            autoStart: true,
            enableThreading: false,
            enablePredictiveAI: true,
            enableAdaptiveQuality: true,
            enableErrorRecovery: true
        });
        window.engine = engine;
        
        // Conectar UI
        setTimeout(() => {
            connectUI(engine);
        }, 1000);
        
        // Notificaciones
        function showNotification(message, type = 'info') {
            const container = document.getElementById('notifications');
            if (!container) return;
            const notif = document.createElement('div');
            notif.className = `notification ${type}`;
            notif.textContent = message;
            container.appendChild(notif);
            setTimeout(() => {
                if (notif.parentNode) notif.parentNode.removeChild(notif);
            }, 4000);
        }
        window.showNotification = showNotification;
    });
    
    // ============================================================
    //  🔌 CONECTAR UI
    //  ============================================================
    function connectUI(engine) {
        console.log('🔌 Conectando UI...');
        
        // ---- Referencias ----
        const hud = {
            fps: document.getElementById('fps'),
            trees: document.getElementById('trees'),
            animals: document.getElementById('animals'),
            ram: document.getElementById('ram'),
            quality: document.getElementById('quality'),
            confidence: document.getElementById('confidence'),
            timeDisplay: document.getElementById('time-display'),
            timeLabel: document.getElementById('time-label'),
            timeIcon: document.getElementById('time-icon'),
            weatherLabel: document.getElementById('weather-label'),
            aiFps: document.getElementById('ai-fps'),
            aiConf: document.getElementById('ai-conf'),
            aiMeta: document.getElementById('ai-meta'),
            aiProgress: document.getElementById('ai-progress-fill'),
            aiDetail: document.getElementById('ai-detail')
        };
        
        // ---- Actualización de estadísticas ----
        setInterval(() => {
            try {
                const stats = engine.getStats();
                const state = stats.state;
                
                if (hud.fps) hud.fps.textContent = state.fps || 0;
                if (hud.aiFps) hud.aiFps.textContent = state.fps || 0;
                if (hud.trees) hud.trees.textContent = state.treesCount || 0;
                if (hud.animals) hud.animals.textContent = state.animalsCount || 0;
                if (hud.ram) hud.ram.textContent = Math.round((state.memoryUsage || 0) / (1024 * 1024)) + ' MB';
                if (hud.quality) hud.quality.textContent = (state.qualityLevel || 'ultra').toUpperCase();
                
                // Confianza IA
                const optimizer = engine.getModule('optimizerAI');
                if (optimizer && optimizer.getStatus) {
                    const status = optimizer.getStatus();
                    const conf = Math.round((status.confidence || 1) * 100);
                    if (hud.confidence) hud.confidence.textContent = conf + '%';
                    if (hud.aiConf) hud.aiConf.textContent = conf + '%';
                }
                
                // Hora
                const renderer = engine.getModule('renderer');
                if (renderer && renderer.dayNight && hud.timeDisplay) {
                    const time = renderer.dayNight.time || 0.5;
                    const hours = Math.floor(time * 24);
                    const mins = Math.floor((time * 24 - hours) * 60);
                    hud.timeDisplay.textContent = `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
                    
                    // Time icon
                    const sunHeight = Math.sin(time * Math.PI * 2);
                    if (sunHeight < -0.3) {
                        if (hud.timeIcon) hud.timeIcon.textContent = '🌙';
                        if (hud.timeLabel) hud.timeLabel.textContent = 'Noche';
                    } else if (sunHeight < 0.3 && sunHeight > 0) {
                        if (hud.timeIcon) hud.timeIcon.textContent = '🌅';
                        if (hud.timeLabel) hud.timeLabel.textContent = 'Amanecer';
                    } else if (sunHeight < 0.3 && sunHeight < 0) {
                        if (hud.timeIcon) hud.timeIcon.textContent = '🌇';
                        if (hud.timeLabel) hud.timeLabel.textContent = 'Atardecer';
                    } else {
                        if (hud.timeIcon) hud.timeIcon.textContent = '☀️';
                        if (hud.timeLabel) hud.timeLabel.textContent = 'Día';
                    }
                }
                
                // Clima
                const weatherFX = engine.getModule('weatherFX');
                if (weatherFX && hud.weatherLabel) {
                    const weather = weatherFX.weatherType || 'clear';
                    const map = { clear: '☀️ Despejado', cloudy: '⛅ Nublado', rain: '🌧️ Lluvia', snow: '❄️ Nieve', stormy: '⛈️ Tormenta' };
                    hud.weatherLabel.textContent = map[weather] || '☀️ Despejado';
                }
                
                // Progreso IA
                if (optimizer && optimizer.getStatus && hud.aiProgress) {
                    const status = optimizer.getStatus();
                    const progress = Math.min(100, (status.confidence || 0.5) * 100);
                    hud.aiProgress.style.width = progress + '%';
                }
                
                // Detalle IA
                if (hud.aiDetail) {
                    hud.aiDetail.textContent = '· ' + state.status + ' · frame ' + state.frameCount;
                }
                
            } catch (e) {}
        }, 300);
        
        // ---- Botones ----
        const qualityButtons = {
            'btn-low': 'low',
            'btn-medium': 'medium',
            'btn-high': 'high',
            'btn-ultra': 'ultra',
            'btn-quantum': 'quantum'
        };
        
        function setActiveButton(activeId) {
            const ids = ['btn-dual', ...Object.keys(qualityButtons)];
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('active', id === activeId);
            });
        }
        
        const dualBtn = document.getElementById('btn-dual');
        if (dualBtn) {
            dualBtn.addEventListener('click', () => {
                engine.manualQuality = false;
                engine.setQuality('ultra');
                setActiveButton('btn-dual');
                showNotification('🧠 Trinity AI activada', 'success');
            });
        }
        
        Object.keys(qualityButtons).forEach(btnId => {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            btn.addEventListener('click', () => {
                engine.manualQuality = true;
                engine.setQuality(qualityButtons[btnId]);
                setActiveButton(btnId);
                showNotification(`⚡ Calidad: ${qualityButtons[btnId].toUpperCase()}`, 'info');
            });
        });
        
        // ---- Time Slider ----
        const timeSlider = document.getElementById('time-slider');
        if (timeSlider) {
            timeSlider.addEventListener('input', (e) => {
                const renderer = engine.getModule('renderer');
                const value = parseFloat(e.target.value);
                if (renderer && renderer.setTimeOfDay) {
                    renderer.setTimeOfDay(value);
                    if (renderer._updateDayNight) renderer._updateDayNight();
                }
            });
        }
        
        // ---- Clima ----
        const weatherBtn = document.getElementById('btn-weather');
        if (weatherBtn) {
            const cycle = ['clear', 'cloudy', 'rain', 'snow', 'stormy'];
            const labels = { clear: '☀️ Claro', cloudy: '⛅ Nublado', rain: '🌧️ Lluvia', snow: '❄️ Nieve', stormy: '⛈️ Tormenta' };
            let idx = 0;
            weatherBtn.addEventListener('click', () => {
                idx = (idx + 1) % cycle.length;
                const weatherFX = engine.getModule('weatherFX');
                if (weatherFX && weatherFX.setWeather) {
                    weatherFX.setWeather(cycle[idx]);
                }
                weatherBtn.textContent = labels[cycle[idx]];
                showNotification(`🌤️ Clima: ${labels[cycle[idx]]}`, 'info');
            });
        }
        
        // ---- Reset ----
        const resetBtn = document.getElementById('btn-reset');
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                engine.manualQuality = false;
                engine.setQuality('ultra');
                setActiveButton('btn-dual');
                engine.reset();
                showNotification('🔄 Motor reiniciado', 'warning');
                setTimeout(() => {
                    engine._generateWorld();
                }, 500);
            });
        }
        
        function showNotification(message, type = 'info') {
            const container = document.getElementById('notifications');
            if (!container) return;
            const notif = document.createElement('div');
            notif.className = `notification ${type}`;
            notif.textContent = message;
            container.appendChild(notif);
            setTimeout(() => {
                if (notif.parentNode) notif.parentNode.removeChild(notif);
            }, 4000);
        }
        window.showNotification = showNotification;
        
        console.log('✅ UI conectada');
    }
    </script>

</body>
</html>
